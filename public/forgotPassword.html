<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - Gerodias PT.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #14622f;
      --green: #17803f;
      --green-light: #3f9a62;
      --bg: #f4f8f5;
      --ink: #12261a;
      --muted: #4a5a50;
      --border: #dbe6df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Public Sans', system-ui, sans-serif;
      color: var(--ink);
    }
    .page { display: grid; grid-template-columns: 45% 55%; min-height: 100vh; }

    .brand {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 48px; color: #fff;
      background:
        radial-gradient(circle at 85% 90%, var(--green-light) 0, transparent 40%),
        linear-gradient(160deg, var(--green-dark), var(--green));
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      display: grid; place-items: center; width: 42px; height: 42px;
      background: #fff; color: var(--green);
      border-radius: 8px; font-weight: 600; font-size: 20px;
    }
    .logo-name { font-size: 34px; font-weight: 600; }
    .brand p { max-width: 340px; margin: 18px 0 0; font-size: 18px; line-height: 1.5; }

    .main {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px; background: var(--bg);
    }
    .card {
      width: 100%; max-width: 415px; padding: 36px;
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(20, 98, 47, 0.08);
    }
    h1 { margin: 0; font-size: 26px; font-weight: 600; }
    .hint { margin: 8px 0 24px; color: var(--muted); font-size: 16px; }

    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    input {
      width: 100%; height: 48px; margin-bottom: 20px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 8px; font: inherit;
    }
    input:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

    button {
      width: 100%; height: 52px; margin-top: 4px;
      background: var(--green); color: #fff; border: 0; border-radius: 8px;
      font: inherit; font-weight: 500; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--green-dark); }
    button:disabled { opacity: .7; cursor: not-allowed; }
    button:focus-visible { outline: 2px solid var(--green-dark); outline-offset: 2px; }

    .msg { margin: 0 0 16px; font-size: 14px; }
    .msg:empty { display: none; }
    .error { color: #b42318; }
    .success { color: var(--green-dark); }

    .login { margin: 24px 0 0; color: var(--muted); font-size: 14px; }
    .login a { color: var(--green-dark); font-weight: 600; }

    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
      .brand { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="brand">
      <div class="logo">
        <span class="logo-mark">G</span>
        <span class="logo-name">Gerodias PT.</span>
      </div>
      <p>Recover your account password securely.</p>
    </aside>

    <main class="main">
      <form class="card" id="forgotForm" novalidate>
        <h1>Forgot password?</h1>
        <p class="hint">Enter your email address and we'll send you a link to reset your password.</p>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com">

        <p class="msg error" id="error" role="alert"></p>
        <p class="msg success" id="success" role="status"></p>

        <button type="submit" id="submit">Send reset link</button>

        <p class="login">Remembered your password? <a href="/login">Log in</a></p>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const submitBtn = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    successEl.textContent = '';

    const email = form.email.value.trim();
    if (!email) {
      errorEl.textContent = 'Please enter your email address.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending link…';

    try {
      const res = await fetch('/api/auth/forgotPassword', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      let data = {};
      try {
        data = await res.json();
      } catch {
        throw new Error('Endpoint not found or server error. Please ensure node index.js is running.');
      }

      if (!res.ok) {
        throw new Error(data.message || 'Failed to send reset email.');
      }

      successEl.textContent = data.message;
      form.email.value = '';
    } catch (err) {
      console.error(err);
      errorEl.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset link';
    }
  });
  </script>
</body>
</html>
