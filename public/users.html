<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Gerodias PT.</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f7f5;
      color: #101828;
    }

    /* Navigation Bar */
    .navbar-custom {
      background-color: #ffffff;
      border-bottom: 1px solid #eaecf0;
      padding: 16px 32px;
    }
    .brand-logo {
      background-color: #117b44;
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    /* Card Container */
    .table-card {
      background: #ffffff;
      border: 1px solid #eaecf0;
      border-radius: 16px;
      box-shadow: 0px 1px 3px rgba(16, 24, 40, 0.05);
      overflow: hidden;
    }

    .table th {
      font-size: 13px;
      font-weight: 500;
      color: #475467;
      background-color: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #eaecf0;
    }

    .table td {
      padding: 18px 24px;
      border-bottom: 1px solid #f2f4f7;
      vertical-align: middle;
    }

    .table tr:last-child td {
      border-bottom: none;
    }

    /* Role Dropdown & Badges */
    .role-select {
      background-color: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 6px 32px 6px 14px;
      font-size: 14px;
      color: #101828;
      appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%3c344054' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 12px;
      cursor: pointer;
      min-width: 145px;
      text-align: left;
    }
    
    .role-badge {
      background-color: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 14px;
      color: #101828;
      display: inline-block;
      min-width: 145px;
      text-align: left;
    }

    /* Status Pills */
    .status-pill {
      display: inline-block;
      padding: 3px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-active {
      background-color: #e6f4ea;
      color: #137333;
    }
    .status-blocked {
      background-color: #fce8e6;
      color: #c5221f;
    }

    /* Action Buttons */
    .btn-add-user {
      background-color: #117b44;
      color: #ffffff;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 20px;
      border: none;
    }
    .btn-add-user:hover {
      background-color: #0d6236;
      color: #ffffff;
    }

    .btn-action-edit {
      background-color: #ffffff;
      border: 1px solid #d0d5dd;
      color: #344054;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action-edit:hover {
      background-color: #f9fafb;
    }

    .btn-action-block, .btn-action-delete {
      background-color: #ffffff;
      border: 1px solid #fecdca;
      color: #d92d20;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action-block:hover, .btn-action-delete:hover {
      background-color: #fef3f2;
    }

    .btn-action-unblock {
      background-color: #ffffff;
      border: 1px solid #a6f4c5;
      color: #079455;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action-unblock:hover {
      background-color: #ecfdf3;
    }

    /* Modal Overlay */
    .modal-backdrop-custom {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(16, 24, 40, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1050;
    }

    /* Modal Hidden Utility Class */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar-custom d-flex justify-content-between align-items-center mb-5">
    <div class="d-flex align-items-center gap-3">
      <div class="brand-logo">G</div>
      <span class="fw-bold fs-5 text-dark">Gerodias PT.</span>
    </div>
    <button id="logoutBtn" class="btn btn-link text-decoration-none text-secondary fw-medium">Logout</button>
  </nav>

  <!-- Main Container -->
  <div class="container" style="max-width: 1100px;">
    
    <!-- Title & Add Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-dark mb-0">User Management</h2>
      <button id="openAddModalBtn" class="btn btn-add-user">+ Add User</button>
    </div>

    <!-- Users Table Card -->
    <div class="table-card mb-5">
      <table class="table mb-0">
        <thead>
          <tr>
            <th style="width: 22%;">Name</th>
            <th style="width: 22%;">Email</th>
            <th style="width: 16%;">Role</th>
            <th style="width: 12%;">Status</th>
            <th style="width: 20%;">Actions</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="5" class="text-center text-muted py-4">Loading users...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- User Form Modal -->
  <div id="userModal" class="modal-backdrop-custom hidden">
    <div class="bg-white p-4 rounded-4 shadow-lg" style="width: 100%; max-width: 440px;">
      <h4 id="modalTitle" class="fw-bold mb-3">Add New User</h4>
      <div id="modalError" class="text-danger small mb-2"></div>
      
      <form id="userForm">
        <input type="hidden" id="userId">
        
        <div class="mb-3">
          <label class="form-label text-secondary small fw-medium">First Name</label>
          <input type="text" id="firstName" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label text-secondary small fw-medium">Last Name</label>
          <input type="text" id="lastName" class="form-control" required>
        </div>
        
        <div class="mb-4">
          <label class="form-label text-secondary small fw-medium">Email Address</label>
          <input type="email" id="userEmail" class="form-control" required>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" id="closeModalBtn" class="btn btn-outline-secondary">Cancel</button>
          <button type="submit" class="btn btn-add-user">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let usersData = [];

    const tableBody = document.getElementById('userTableBody');
    const userModal = document.getElementById('userModal');
    const userForm = document.getElementById('userForm');
    const modalTitle = document.getElementById('modalTitle');
    const modalError = document.getElementById('modalError');

    // Default roles mapping
    const availableRoles = [
      { id: '4', name: 'Superadmin' },
      { id: '5', name: 'Administrator' },
      { id: '6', name: 'Staff' },
      { id: '14', name: 'User' }
    ];
    
    // Load users on init
    loadUsers();

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users');
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || `Server Error (${res.status})`);
        }

        usersData = data;
        renderTable(usersData);
      } catch (err) {
        if (tableBody) {
          tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${escapeHtml(err.message)}</td></tr>`;
        }
      }
    }

    // Helper to generate role <option> tags for dropdowns
    function generateRoleOptions(selectedRoleId) {
      return availableRoles.map(r => `
        <option value="${r.id}" ${String(r.id) === String(selectedRoleId) ? 'selected' : ''}>
          ${escapeHtml(r.name)}
        </option>
      `).join('');
    }

    function renderTable(users) {
      const tbody = document.getElementById('userTableBody');
      if (!tbody) return;
    
      if (!users || users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(user => {
        // Display role name cleanly
        const displayRoleName = user.roleName === 'Standard User' ? 'User' : (user.roleName || 'Staff');

        // 1. Role Column
        const roleContent = user.canChangeRole
          ? `<select class="role-select" onchange="changeRole('${user.id}', this.value)">
               ${generateRoleOptions(user.roleId)}
             </select>`
          : `<span class="role-badge">${escapeHtml(displayRoleName)}</span>`;

        // 2. Status Badge
        const statusBadge = user.isBlocked
          ? `<span class="status-pill status-blocked">Blocked</span>`
          : `<span class="status-pill status-active">Active</span>`;

        // 3. Action Buttons (Flexbox inline layout)
        const editBtn = user.canEdit
          ? `<button class="btn-action-edit" onclick="openEditModal('${user.id}')">Edit</button>`
          : '';

        const blockBtn = user.canBlock
          ? `<button class="${user.isBlocked ? 'btn-action-unblock' : 'btn-action-block'}" onclick="toggleBlock('${user.id}', ${!user.isBlocked})">
               ${user.isBlocked ? 'Unblock' : 'Block'}
             </button>`
          : '';

        const deleteBtn = user.canDelete
          ? `<button class="btn-action-delete" onclick="deleteUser('${user.id}')">Delete</button>`
          : '';

        const actionsList = [editBtn, blockBtn, deleteBtn].filter(Boolean).join('');
        const actionsContent = actionsList 
          ? `<div class="d-flex align-items-center gap-2">${actionsList}</div>` 
          : `<span class="text-muted small">No actions available</span>`;

        return `
          <tr>
            <td class="fw-bold align-middle" style="color: #101828;">
              ${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)} 
              ${user.isSelf ? '<span class="badge bg-secondary-subtle text-secondary ms-1">You</span>' : ''}
            </td>
            <td class="align-middle text-truncate" style="color: #344054; max-width: 180px;" title="${escapeHtml(user.email)}">
              ${escapeHtml(user.email)}
            </td>
            <td class="align-middle">${roleContent}</td>
            <td class="align-middle">${statusBadge}</td>
            <td class="align-middle" style="white-space: nowrap;">${actionsContent}</td>
          </tr>
        `;
      }).join('');
    }

    // Modal Control
    const openAddModalBtn = document.getElementById('openAddModalBtn');
    if (openAddModalBtn) {
      openAddModalBtn.addEventListener('click', () => {
        userForm.reset();
        document.getElementById('userId').value = '';
        modalTitle.textContent = 'Add New User';
        modalError.textContent = '';
        userModal.classList.remove('hidden');
      });
    }

    const closeModalBtn = document.getElementById('closeModalBtn');
    if (closeModalBtn) {
      closeModalBtn.addEventListener('click', () => {
        userModal.classList.add('hidden');
      });
    }

    window.openEditModal = function(id) {
      const user = usersData.find(u => u.id == id);
      if (!user) return;

      document.getElementById('userId').value = user.id;
      document.getElementById('firstName').value = user.firstName;
      document.getElementById('lastName').value = user.lastName;
      document.getElementById('userEmail').value = user.email;

      modalTitle.textContent = 'Edit User';
      modalError.textContent = '';
      userModal.classList.remove('hidden');
    };

    // Form Submit Handler (Create & Update)
    if (userForm) {
      userForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        modalError.textContent = '';

        const id = document.getElementById('userId').value;
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('userEmail').value;

        const isEdit = Boolean(id);
        const url = isEdit ? `/api/admin/users/${id}` : '/api/admin/users';
        const method = isEdit ? 'PUT' : 'POST';

        try {
          const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, firstName, lastName })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Action failed.');

          userModal.classList.add('hidden');
          loadUsers();

        } catch (err) {
          modalError.textContent = err.message;
        }
      });
    }

    // Approve Handler
    window.approveUser = async function(id) {
      if (!confirm('Approve this pending user account?')) return;

      try {
        const res = await fetch(`/api/admin/users/${id}/approve`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Approval failed.');

        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    };
    
    // Change Role Handler
    window.changeRole = async function(id, roleId) {
      try {
        const res = await fetch(`/api/admin/users/${id}/role`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roleId: roleId })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Role designation failed.');

        loadUsers();
      } catch (err) {
        alert(err.message);
        loadUsers();
      }
    };

    // Block/Unblock Handler
    window.toggleBlock = async function(id, shouldBlock) {
      if (!confirm(`Are you sure you want to ${shouldBlock ? 'block' : 'unblock'} this user?`)) return;

      try {
        const res = await fetch(`/api/admin/users/${id}/block`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isBlocked: shouldBlock })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Block update failed.');

        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    };

    // Soft-Delete Handler
    window.deleteUser = async function(id) {
      if (!confirm('Are you sure you want to delete this user account?')) return;

      try {
        const res = await fetch(`/api/admin/users/${id}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Delete failed.');

        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    };

    // Logout Handler
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
