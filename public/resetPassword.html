<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Gerodias PT.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #14622f;
      --green: #17803f;
      --green-light: #3f9a62;
      --bg: #f4f8f5;
      --ink: #12261a;
      --muted: #4a5a50;
      --border: #dbe6df;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Public Sans', system-ui, sans-serif;
      color: var(--ink);
    }
    .page { display: grid; grid-template-columns: 45% 55%; min-height: 100vh; }

    .brand {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 48px; color: #fff;
      background:
        radial-gradient(circle at 85% 90%, var(--green-light) 0, transparent 40%),
        linear-gradient(160deg, var(--green-dark), var(--green));
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      display: grid; place-items: center; width: 42px; height: 42px;
      background: #fff; color: var(--green);
      border-radius: 8px; font-weight: 600; font-size: 20px;
    }
    .logo-name { font-size: 34px; font-weight: 600; }
    .brand p { max-width: 340px; margin: 18px 0 0; font-size: 18px; line-height: 1.5; }

    .main {
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px; background: var(--bg);
    }
    .card {
      width: 100%; max-width: 415px; padding: 36px;
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(20, 98, 47, 0.08);
    }
    h1 { margin: 0; font-size: 26px; font-weight: 600; }
    .hint { margin: 8px 0 24px; color: var(--muted); font-size: 16px; }

    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
    input {
      width: 100%; height: 48px; margin-bottom: 20px; padding: 0 14px;
      border: 1px solid var(--border); border-radius: 8px; font: inherit;
    }
    input:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

    .input-group {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }
    .input-group input {
      margin-bottom: 0;
      padding-right: 64px;
    }
    .toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      height: auto;
      width: auto;
      margin: 0;
      padding: 4px 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .toggle-btn:hover:not(:disabled) {
      background: transparent;
      color: var(--ink);
    }

    button[type="submit"] {
      width: 100%; height: 52px; margin-top: 4px;
      background: var(--green); color: #fff; border: 0; border-radius: 8px;
      font: inherit; font-weight: 500; cursor: pointer;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--green-dark); }
    button[type="submit"]:disabled { opacity: .7; cursor: not-allowed; }
    button[type="submit"]:focus-visible { outline: 2px solid var(--green-dark); outline-offset: 2px; }

    .msg { margin: 0 0 16px; font-size: 14px; }
    .msg:empty { display: none; }
    .error { color: #b42318; }
    .success { color: var(--green-dark); }

    .login { margin: 24px 0 0; color: var(--muted); font-size: 14px; }
    .login a { color: var(--green-dark); font-weight: 600; }

    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
      .brand { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="brand">
      <div class="logo">
        <span class="logo-mark">G</span>
        <span class="logo-name">Gerodias PT.</span>
      </div>
      <p>Enter your new password below to regain access to your account.</p>
    </aside>

    <main class="main">
      <form class="card" id="resetForm" novalidate>
        <h1>Reset password</h1>
        <p class="hint">Create a new password for your account.</p>

        <label for="newPassword">New Password</label>
        <div class="input-group">
          <input type="password" id="newPassword" required>
          <button type="button" class="toggle-btn" data-target="newPassword">Show</button>
        </div>

        <label for="confirmNewPassword">Confirm Password</label>
        <div class="input-group">
          <input id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="toggle-btn" data-target="confirmNewPassword">Show</button>
        </div>

        <p class="msg error" id="error" role="alert"></p>
        <p class="msg success" id="success" role="status"></p>

        <button type="submit" id="submit">Reset password</button>

        <p class="login">Back to <a href="/login">Log in</a></p>
      </form>
    </main>
  </div>

  <script>
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        e.preventDefault();
      
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);

        if (input) {
          if (input.type === 'password') {
            input.type = 'text';
            this.textContent = 'Hide';
          } else {
            input.type = 'password';
            this.textContent = 'Show';
          }
        }
      });
    });

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const email = urlParams.get('email');

    const form = document.querySelector('form');
    const errorEl = document.querySelector('.msg.error') || document.getElementById('error');
    const successEl = document.querySelector('.msg.success') || document.getElementById('success');
    const submitBtn = document.querySelector('button[type="submit"]');

    if (!token || !email) {
      if (errorEl) errorEl.textContent = 'Invalid reset link. Missing token or email parameter.';
      if (submitBtn) submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (errorEl) errorEl.textContent = '';
      if (successEl) successEl.textContent = '';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmPassword) {
        if (errorEl) errorEl.textContent = 'Passwords do not match.';
        return;
      }

      if (newPassword.length < 8) {
        if (errorEl) errorEl.textContent = 'Password must be at least 8 characters long.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting password…';

      try {
        const res = await fetch('/api/auth/resetPassword', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, newPassword })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Failed to reset password.');
        }

        if (successEl) successEl.textContent = data.message;
        setTimeout(() => {
          window.location.href = '/login';
        }, 1500);

      } catch (err) {
        console.error(err);
      if (errorEl) errorEl.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';
      }
    });
  </script>
</body>
</html>
